# v15 / Phase 2 — 20x20 coverage with SAFETY ACTION-MASKING (open-Q#3 option 2, escalation).
# Canonical chain (docs/iterations/HISTORY.md): v14 = the curriculum ladder that WALLED at 20x20
# (run runs/0611_15_coverage-20x20-b15-w20-v2, ~0.645 cov, 82% body-deaths, decays on resume —
# plateau confirmed 2026-06-28). v14's gap is self-avoidance at 400 cells; HISTORY.md names
# action-masking as the next lever ("constrain the action space"). This is v15.
#
# v15 keeps the entire v14/D2 recipe and flips ONE variable: mask_mode=safety. The mask removes only
# moves that step into a wall/body (the env's exact death rule, resolved through the opposite-guard),
# so the policy can never 1-step-suicide; the residual deaths it can't prevent (multi-step entrapment
# that boxes the snake into a no-safe-move state) become the thing we measure. Obs and architecture
# are UNCHANGED (mask is computed in the train loop, not an obs channel) -> the warm-start loads strict.
#
# Recommended launch (single-variable A/B vs the v14/D2 control, identical init):
#   python train.py --training coverage_20x20_v15 \
#     --init-from runs/0610_22_coverage-16x16-b15-w20 \
#     training.hypothesis_slug=coverage-20x20-mask-safety
# Upper-bound ablation (v15b): clone with mask_mode=cycle -> guaranteed full-fill, trivial RL.
#
# Cloned from coverage_10x10_v10.yaml; only game size + reward block (matched to v14/D2) + mask_mode changed.
game:
  rows: 20
  cols: 20
model:
  arch: hybrid
  obs_type: hybrid
  hidden_size: 128
  num_layers: 2           # held across the curriculum; channels[-1]=32 fixed for transfer
  activation: relu
  adaptive_pool_size: 4   # size-agnostic encoder; identical arch to v9/v14 so warm-start loads strict
ppo:
  learning_rate: 0.00025
  gamma: 0.99
  gae_lambda: 0.95
  num_minibatches: 4
  update_epochs: 4
  clip_coef: 0.2
  ent_coef: 0.03          # keep exploration up to avoid premature collapse
  vf_coef: 0.5
  max_grad_norm: 0.5
training:
  num_envs: 256
  num_steps: 128
  num_updates: 0          # unlimited; run until plateau (external coverage watcher) or time backstop
  seed: 1
  max_hours: 0            # plateau-only stop (watcher); no wall backstop
  plateau_steps: 1000000
  plateau_threshold: 0.1
  # --- Coverage-oriented reward (D14), held from v6..v14 ---
  dist_shaping_alpha: 0.0
  step_penalty: 0.0
  win_bonus: 20.0         # matched to v14/D2 (the stable curriculum setting)
  # --- v10 Hamiltonian cycle-alignment shaping, matched to v14/D2 (held for clean A/B) ---
  cycle_beta: 0.15        # same prior as v14/D2; the ONLY change vs that control is mask_mode below
  # --- v15 action masking (NEW) ---
  mask_mode: safety       # "none" | "safety" (mask instant wall/body deaths) | "cycle" (force on-cycle)
  best_metric: coverage   # select best.pt on avg_coverage (shaped avg_return not comparable across betas)
  max_memory_pct: 98
  hypothesis_slug: coverage-20x20-mask-safety
checkpointing:
  num_checkpoints: 5
experiments_dir: runs
video:
  num_videos: 5
  final_episodes: 3
  render_cell_size: 100
  fps: 30
