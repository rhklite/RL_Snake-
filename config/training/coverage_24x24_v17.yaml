# v17 / Phase 2 — 24x24: resume the board-size ladder with the v16 recipe (safety-mask + LR-anneal).
# v14's shaping recipe WALLED at 20x20 (0.645). v15 broke it with action-masking (peak 0.716/0.756),
# v16 stabilized it with LR-anneal (stable 0.728, win 27%). v17 asks the open question: does masking +
# a held plateau let the CURRICULUM CLIMB AGAIN past where shaping walled? First rung: 24x24 (576 cells).
#
# Same recipe as v16 (safety mask + LR anneal + β=0.15/win=20), warm-started UP the ladder from the v16
# 20x20 policy (adaptive-pool encoder is size-agnostic -> strict load 20->24). LR-anneal horizon bumped
# 1000->1500 for the larger board (later peak expected); max_hours backstop 4h (24x24 is slower/cell).
#
# Launch:
#   python train.py --training coverage_24x24_v17 \
#     --init-from runs/0628_14_coverage-20x20-mask-anneal/checkpoints/best.pt \
#     training.hypothesis_slug=coverage-24x24-mask-anneal
#
# Cloned from coverage_20x20_v16.yaml; only game size + lr_anneal_updates + max_hours changed.
game:
  rows: 24
  cols: 24
model:
  arch: hybrid
  obs_type: hybrid
  hidden_size: 128
  num_layers: 2
  activation: relu
  adaptive_pool_size: 4    # size-agnostic encoder -> warm-start 20x20 -> 24x24 loads strict
ppo:
  learning_rate: 0.00025
  gamma: 0.99
  gae_lambda: 0.95
  num_minibatches: 4
  update_epochs: 4
  clip_coef: 0.2
  ent_coef: 0.03
  vf_coef: 0.5
  max_grad_norm: 0.5
  anneal_lr: true
  lr_anneal_updates: 1500  # base LR @upд0 -> 0 @upд1500 (more room than v16's 1000 for the larger board)
training:
  num_envs: 256
  num_steps: 128
  num_updates: 0
  seed: 1
  max_hours: 4.0           # backstop (watcher unreliable; 24x24 slower/cell) — resume if it needs more
  plateau_steps: 1000000
  plateau_threshold: 0.1
  dist_shaping_alpha: 0.0
  step_penalty: 0.0
  win_bonus: 20.0
  cycle_beta: 0.15
  mask_mode: safety
  vectorized_env: true
  best_metric: coverage
  max_memory_pct: 98
  hypothesis_slug: coverage-24x24-mask-anneal
checkpointing:
  num_checkpoints: 5
experiments_dir: runs
video:
  num_videos: 5
  final_episodes: 3
  render_cell_size: 100
  fps: 30
